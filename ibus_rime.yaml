# ibus-rime configuration

config_version: '1.7'

style:
  # candidate list orientation (false|true).
  horizontal: true

  # embed preedit text in the input field (false|true).
  inline_preedit: true

  # `aux_preedit` shows what the schema made of the input above the candidates
  # (tone marks, the script the input is written to, converted segments).
  aux_preedit: true

  # display updated IME status at cursor position.
  status_hint: true
